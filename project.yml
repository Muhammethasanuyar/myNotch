name: MyNotch
options:
  bundleIdPrefix: com.emre
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.4"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    # No signing identity on this machine: ad-hoc "Sign to Run Locally" for Debug builds.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"

# The one Swift package this project takes: the update framework. Pinned to an exact version so every
# machine builds the same Sparkle; bump it deliberately (docs/RELEASE.md).
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6

targets:
  MyNotch:
    type: application
    platform: macOS
    sources:
      - App
      - Core
      - Modules
      - DebugPreview
      - Settings
      # mediaremote-adapter (BSD-3): launched by /usr/bin/perl, never linked. Built by
      # scripts/vendor-mediaremote-adapter.sh; the framework is embedded below.
      - path: Vendor/mediaremote-adapter/mediaremote-adapter.pl
        buildPhase: resources
      - path: Vendor/mediaremote-adapter/MediaRemoteAdapterTestClient
        buildPhase: resources
      - path: Resources/AppIcon.icns
        buildPhase: resources
    dependencies:
      - framework: Vendor/mediaremote-adapter/MediaRemoteAdapter.framework
        embed: true
        codeSign: true
        link: false
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emre.mynotch
        # UI app: everything is main-actor by default; pure helpers opt out with `nonisolated`.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        # Sandbox stays off (AppleScript automation + ~/.claude file watching later).
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
    info:
      path: Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: MyNotch
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSPrincipalClass: NSApplication
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "Copyright © 2026 Muhammet Hasan Uyar. MIT License."
        CFBundleIconFile: AppIcon
        # Sparkle: the appcast lives in this repository; the public key pairs with the EdDSA key
        # in the release machine's Keychain (docs/RELEASE.md). Updates are offered, never installed
        # without asking.
        SUFeedURL: https://raw.githubusercontent.com/Muhammethasanuyar/myNotch/main/appcast.xml
        SUPublicEDKey: NyKDlpcr+qf81QzCWhQT5d952q0bpZQek/gtEVATV2k=
        SUAutomaticallyUpdate: false
        SUScheduledCheckInterval: 86400
        NSAppleEventsUsageDescription: "MyNotch asks Spotify and Music what is playing so it can show it in the notch."
        NSCalendarsFullAccessUsageDescription: "MyNotch reads your upcoming events to count down to the next meeting in the notch. Nothing leaves this Mac."
        NSAudioCaptureUsageDescription: "MyNotch listens to what the Mac plays so the bars beside the notch can move to the music. The audio is reduced to six levels inside the app and never stored or sent."
    scheme:
      testTargets:
        - MyNotchTests

  MyNotchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - MyNotchTests
    dependencies:
      - target: MyNotch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emre.mynotch.tests
        GENERATE_INFOPLIST_FILE: YES
