name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] || { echo "no Xcode 26 on this runner"; ls /Applications | grep -i xcode; exit 1; }
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate and test
        run: |
          xcodegen generate --quiet
          xcodebuild -project MyNotch.xcodeproj -scheme MyNotch -configuration Debug \
            -destination 'platform=macOS' -resolvePackageDependencies -quiet
          xcodebuild -project MyNotch.xcodeproj -scheme MyNotch -configuration Debug \
            -destination 'platform=macOS' CODE_SIGN_IDENTITY="-" test 2>&1 | tail -40
